name: EveDirector local-first

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "scripts/evedirector_local_first.py"
      - "scripts/evedirector-local-first.ps1"
      - "tests/test_evedirector_local_first.py"
      - "docs/EVEDIRECTOR_LOCAL_FIRST.md"
      - "Makefile"
      - ".github/workflows/evedirector-local-first.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harness-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Compile harness
        run: python -m py_compile scripts/evedirector_local_first.py

      - name: Run harness contract tests
        run: python -m pytest tests/test_evedirector_local_first.py -q
