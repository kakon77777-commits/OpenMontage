name: EveDirector L6 unified workbench

on:
  push:
    branches:
      - evedirector-l6-unified-workbench
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "backlot/__init__.py"
      - "backlot/director.py"
      - "backlot/ui/director.*"
      - "backlot/ui/agent-review-l5.js"
      - "tests/test_evedirector_unified_workbench.py"
      - "docs/EVEDIRECTOR_L6_UNIFIED_WORKBENCH.md"
      - ".github/workflows/evedirector-l6-unified-workbench.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unified-workbench-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install focused dependencies
        run: python -m pip install -q pytest pyyaml fastapi httpx jsonschema

      - name: Compile L6 modules and browser code
        run: |
          python -m py_compile backlot/director.py
          python -m py_compile backlot/__init__.py
          python -m py_compile backlot/agent_edit.py
          python -m py_compile backlot/agent_review.py
          node --check backlot/ui/director.js
          node --check backlot/ui/agent-review-l5.js

      - name: Run L3 through L6 focused tests
        shell: bash
        run: |
          set +e
          python -m pytest \
            tests/test_evedirector_local_agent.py \
            tests/test_backlot_agent_review.py \
            tests/test_evedirector_constrained_editor.py \
            tests/test_evedirector_editor_guard.py \
            tests/test_evedirector_unified_workbench.py \
            -q --tb=short > l6-pytest.log 2>&1
          status=$?
          cat l6-pytest.log
          exit $status

      - name: Verify unified authority markers
        if: always()
        run: |
          grep -q "layout_persistence.*browser-local-only" backlot/director.py
          grep -q "arbitrary_node_creation.*False" backlot/director.py
          grep -q "agent-edit.*derive" backlot/director.py
          grep -q "CREATE DERIVED CANDIDATE" backlot/ui/director.js
          grep -q "Canvas positions stay in browser local storage" backlot/ui/director.js
          grep -q "The L6 router is read-only" docs/EVEDIRECTOR_L6_UNIFIED_WORKBENCH.md

      - name: Upload L6 test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evedirector-l6-test-diagnostics
          if-no-files-found: warn
          retention-days: 30
          path: l6-pytest.log
