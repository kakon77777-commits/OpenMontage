name: EveDirector L4 review workbench

on:
  push:
    branches:
      - main
    paths:
      - "backlot/agent_review.py"
      - "backlot/server.py"
      - "backlot/ui/agent-review.*"
      - "backlot/ui/board.html"
      - "tests/test_backlot_agent_review.py"
      - "docs/EVEDIRECTOR_L4_REVIEW_WORKBENCH.md"
      - ".github/workflows/evedirector-l4-review-workbench.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "backlot/agent_review.py"
      - "backlot/server.py"
      - "backlot/ui/agent-review.*"
      - "backlot/ui/board.html"
      - "tests/test_backlot_agent_review.py"
      - "docs/EVEDIRECTOR_L4_REVIEW_WORKBENCH.md"
      - ".github/workflows/evedirector-l4-review-workbench.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evedirector-l4-review-workbench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review-workbench-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install focused dependencies
        run: python -m pip install -q pytest pyyaml jsonschema fastapi httpx

      - name: Compile L4 modules
        run: |
          python -m py_compile backlot/agent_review.py
          python -m py_compile backlot/server.py

      - name: Run L3 and L4 focused tests
        shell: bash
        run: |
          set +e
          python -m pytest tests/test_evedirector_local_agent.py tests/test_backlot_agent_review.py -q --tb=short > l4-pytest.log 2>&1
          status=$?
          cat l4-pytest.log
          exit $status

      - name: Verify UI contract markers
        if: always()
        run: |
          grep -q "EveDirector Review" backlot/ui/agent-review.html
          grep -q "semanticChanges" backlot/ui/agent-review.js
          grep -q "BACKLOT_ENABLE_AGENT_ACTIONS" docs/EVEDIRECTOR_L4_REVIEW_WORKBENCH.md

      - name: Upload L4 test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evedirector-l4-test-diagnostics
          if-no-files-found: warn
          retention-days: 30
          path: l4-pytest.log
